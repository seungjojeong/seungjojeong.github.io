<script>
(function () {
  var box = document.getElementById('lightbox');
  var img = box.querySelector('img');
  var cap = box.querySelector('figcaption');
  var shut = box.querySelector('button');
  var last = null;

  function open(link) {
    var source = link.querySelector('img');
    img.src = link.getAttribute('href');
    img.alt = source ? source.alt : '';
    var figure = link.closest('figure');
    var text = figure && figure.querySelector('figcaption');
    // the caption's own markup is reused rather than its text, so the
    // italic on the work's title survives into the enlarged view
    var html = text ? text.innerHTML.trim() : '';

    // installation views share a caption declared on the grid; a figure's
    // own caption, where it has one, follows it
    var group = figure && figure.closest('[data-caption]');
    if (group) html = html ? group.getAttribute('data-caption') + ' ' + html : group.getAttribute('data-caption');

    cap.innerHTML = html;
    box.hidden = false;
    box.classList.add('open');
    document.body.style.overflow = 'hidden';
    last = link;
    shut.focus();
  }

  function close() {
    box.classList.remove('open');
    box.hidden = true;
    img.removeAttribute('src');
    document.body.style.overflow = '';
    if (last) { last.focus(); last = null; }
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('a.zoom') : null;
    if (link) {                      // plain left-click only: let the reader
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();            // still open the file in a new tab
      open(link);
      return;
    }
    if (box.classList.contains('open')) close();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && box.classList.contains('open')) close();
  });
})();
</script>
